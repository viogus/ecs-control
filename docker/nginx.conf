server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # 日志输出到 stdout/stderr，由 Docker 收集
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS:经 HTTPS 反代部署时由反代透传生效;此处直接设置,HTTP 场景无副作用
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 基础 CSP:限制资源来源(应用为 Vue 运行时编译,允许内联脚本/样式)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 1000;
    gzip_vary on;

    # 静态资源缓存
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 处理前端路由
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 处理 PHP 请求
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 安全配置：禁止访问 .ht* 文件
    location ~ /\.ht {
        deny all;
    }
    
    # 安全配置：严禁外部直接访问 SQLite 数据库文件及 data 目录
    location ^~ /data/ {
        deny all;
        return 403;
    }
    
    # 禁止访问 git 文件
    location ~ /\.git {
        deny all;
    }
    
    # 禁止访问 composer 文件
    location ~ /composer\.(json|lock) {
        deny all;
    }
}