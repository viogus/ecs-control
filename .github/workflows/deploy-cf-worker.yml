name: Deploy CF Worker

on:
  push:
    branches: [main]
    paths:
      - 'cf-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-worker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cf-worker/package-lock.json

      - run: npm ci

      - name: Init D1 (create if not exists, populate database_id)
        run: |
          # Method 1: list existing D1 databases via JSON API
          echo "=== d1 list ==="
          npx wrangler d1 list --json 2>&1 | tee /tmp/d1-list.txt || true
          uuid=$(node -e "
            try {
              const d=JSON.parse(require('fs').readFileSync('/tmp/d1-list.txt','utf8'));
              const arr=Array.isArray(d)?d:(d.result||[]);
              const db=arr.find(x=>x.name==='ecs-control-db');
              if(db) process.stdout.write(db.uuid||db.database_id||'');
            } catch(e){ process.stdout.write('parse_error'); }
          ")

          # Method 2: parse d1 create output (database already exists)
          if [ "$uuid" = "parse_error" ] || [ -z "$uuid" ]; then
            echo "=== d1 create (will fail if exists, showing UUID) ==="
            npx wrangler d1 create ecs-control-db 2>&1 | tee /tmp/d1-create.txt || true
            uuid=$(grep -oE '[a-f0-9-]{36}' /tmp/d1-create.txt | head -1 || true)
          fi

          # Method 3: create using REST API directly
          if [ -z "$uuid" ]; then
            echo "=== Trying Cloudflare REST API ==="
            list=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts?per_page=1")
            account_id=$(echo "$list" | node -e "
              let s='';process.stdin.on('data',c=>s+=c);
              process.stdin.on('end',()=>{
                try{const d=JSON.parse(s);process.stdout.write(d.result[0].id||'')}catch(e){}
              })
            ")
            if [ -n "$account_id" ]; then
              echo "Account ID: $account_id"
              dbs=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database")
              echo "$dbs" | node -e "
                let s='';process.stdin.on('data',c=>s+=c);
                process.stdin.on('end',()=>{
                  try{
                    const d=JSON.parse(s);
                    const db=(d.result||[]).find(x=>x.name==='ecs-control-db');
                    if(db) process.stdout.write(db.uuid||db.database_id||'');
                  }catch(e){}
                })
              " > /tmp/d1-api-uuid.txt
              uuid=$(cat /tmp/d1-api-uuid.txt)
              if [ -z "$uuid" ]; then
                echo "Creating via API..."
                cr=$(curl -s -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database" \
                  -d '{"name":"ecs-control-db"}')
                echo "$cr" | node -e "
                  let s='';process.stdin.on('data',c=>s+=c);
                  process.stdin.on('end',()=>{
                    try{const d=JSON.parse(s);process.stdout.write(d.result.uuid||'')}catch(e){}
                  })
                " > /tmp/d1-api-uuid.txt
                uuid=$(cat /tmp/d1-api-uuid.txt)
              fi
            fi
          fi

          if [ -z "$uuid" ]; then
            echo "::error::Failed to get D1 database UUID"
            exit 1
          fi
          echo "D1 UUID: $uuid"
          sed -i "s/database_id = \"\"/database_id = \"$uuid\"/" wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Set worker secrets (first run only, skipped if exist)
        run: |
          # Use Cloudflare REST API to check if secrets exist (more reliable than wrangler CLI)
          ACCOUNT=$(curl -sH "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts?per_page=1" | \
            node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).result[0].id||'')}catch(e){}})")
          SCRIPT=$(grep '^name =' wrangler.toml | sed 's/.*= *"\(.*\)"/\1/')
          SECRETS=$(curl -sH "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/$SCRIPT/secrets" | \
            node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{const r=JSON.parse(s);const n=new Set((r.result||[]).map(x=>x.name));process.stdout.write(n.has('ENCRYPTION_KEY')&&n.has('JWT_SECRET')?'exists':'missing')}catch(e){process.stdout.write('missing')}})")
          if [ "$SECRETS" = "exists" ]; then
            echo "Secrets already set, skipping"
          else
            echo "Generating new secrets..."
            key1=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
            key2=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
            echo "$key1" | npx wrangler secret put ENCRYPTION_KEY
            echo "$key2" | npx wrangler secret put JWT_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Apply D1 schema
        run: npx wrangler d1 execute ecs-control-db --remote --file=db/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
