name: Deploy CF Worker

on:
  push:
    branches: [main]
    paths:
      - 'cf-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cf-worker

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cf-worker/package-lock.json

      - run: npm ci

      - name: Init D1 (create if not exists, populate database_id)
        run: |
          uuid=""
          # Method 1: d1 list JSON output (most reliable)
          npx wrangler d1 list --format json > /tmp/d1-list.json 2>/dev/null || true
          uuid=$(node -e "
            try {
              const d=JSON.parse(require('fs').readFileSync('/tmp/d1-list.json','utf8'));
              const arr=Array.isArray(d)?d:(d.result||[]);
              const db=arr.find(x=>x.name==='ecs-control-db');
              if(db) process.stdout.write(db.uuid||db.database_id||'');
            } catch(e){}
          ")

          # Method 2: d1 info text output
          if [ -z "$uuid" ]; then
            echo "Trying d1 info..."
            npx wrangler d1 info ecs-control-db > /tmp/d1-info.txt 2>&1 || true
            cat /tmp/d1-info.txt
            uuid=$(grep -oE '[a-f0-9-]{36}' /tmp/d1-info.txt | head -1 || true)
          fi

          # Method 3: create new (fails if exists, but output has UUID in error msg?)
          if [ -z "$uuid" ]; then
            echo "Creating D1 database ecs-control-db..."
            npx wrangler d1 create ecs-control-db 2>&1 | tee /tmp/d1-create.txt || true
            uuid=$(grep -oE '[a-f0-9-]{36}' /tmp/d1-create.txt | head -1 || true)
          fi

          if [ -z "$uuid" ]; then
            echo "::error::Failed to get D1 database UUID"
            exit 1
          fi
          echo "D1 UUID: $uuid"
          sed -i "s/database_id = \"\"/database_id = \"$uuid\"/" wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Generate and set worker secrets (first run only)
        run: |
          existing=$(npx wrangler secret list --format json 2>/dev/null | \
            node -e "const s=require('fs').readFileSync(0,'utf8');try{const j=JSON.parse(s);const n=new Set(j.map(x=>x.name));if(n.has('ENCRYPTION_KEY')&&n.has('JWT_SECRET'))process.stdout.write('exists')}catch(e){}")
          if [ "$existing" = "exists" ]; then
            echo "Secrets already set on Cloudflare, skipping"
          else
            key1=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
            key2=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")
            echo "Setting ENCRYPTION_KEY..."
            echo "$key1" | npx wrangler secret put ENCRYPTION_KEY
            echo "Setting JWT_SECRET..."
            echo "$key2" | npx wrangler secret put JWT_SECRET
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Apply D1 schema
        run: npx wrangler d1 execute ecs-control-db --remote --file=db/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
